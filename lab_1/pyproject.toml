[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submission-system"
version = "0.3.0"
description = "Приём, валидация, анализ сходства и ограниченный исполнитель заданий"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Denis Kazartsev" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["mlflow>=3.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
